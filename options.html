<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<title>和暦⇔西暦 変換 - 出力書式</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; --line: #8884; --accent: #22386e; }
  body { font: 15px/1.7 system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; max-width: 640px; margin: 32px auto; padding: 0 20px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.lead { margin: 0 0 24px; opacity: .75; }
  fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 16px; padding: 12px 16px 14px; }
  legend { font-weight: 600; padding: 0 6px; }
  label { display: inline-block; margin: 2px 16px 2px 0; white-space: nowrap; }
  .note { font-size: 13px; opacity: .7; margin: 6px 0 0; }
  .preview { border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; margin: 20px 0; }
  .preview h2 { font-size: 14px; margin: 0 0 6px; opacity: .75; }
  .preview div { font-variant-numeric: tabular-nums; padding: 2px 0; }
  .preview .in { opacity: .6; }
  .row { display: flex; align-items: center; gap: 12px; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
  #status { font-size: 13px; opacity: .7; }
</style>
<body>
  <h1>出力書式</h1>
  <p class="lead">変換結果の表示とコピーに使う書式です。変更はすぐ保存されます。</p>

  <fieldset>
    <legend>区切り文字</legend>
    <label><input type="radio" name="sep" value="kanji"> 年月日（2024年3月15日）</label>
    <label><input type="radio" name="sep" value="slash"> スラッシュ（2024/3/15）</label>
    <label><input type="radio" name="sep" value="dot"> ドット（2024.3.15）</label>
    <label><input type="radio" name="sep" value="hyphen"> ハイフン（2024-3-15）</label>
    <label><input type="radio" name="sep" value="none"> なし（20240315）</label>
    <p class="note">「なし」は月日が常に2桁になります。年だけの結果は「2024年」のままです。</p>
  </fieldset>

  <fieldset>
    <legend>0埋め</legend>
    <label><input type="checkbox" name="pad"> 月日を2桁にする（3月5日 → 03月05日）</label>
  </fieldset>

  <fieldset>
    <legend>曜日</legend>
    <label><input type="radio" name="weekday" value="paren-full"> （金）</label>
    <label><input type="radio" name="weekday" value="paren-half"> (金)</label>
    <label><input type="radio" name="weekday" value="full"> 金曜日</label>
    <label><input type="radio" name="weekday" value="none"> 表示しない</label>
    <div><label><input type="checkbox" name="copyWeekday"> コピーする文字列にも曜日を含める</label></div>
    <p class="note">曜日は年月日がそろっているときだけ付きます。明治5年以前（旧暦）には付きません。</p>
  </fieldset>

  <fieldset>
    <legend>和暦の書式</legend>
    <label><input type="radio" name="warekiStyle" value="long"> 令和6年</label>
    <label><input type="radio" name="warekiStyle" value="alpha"> 略記 R6</label>
    <div><label><input type="checkbox" name="gannen"> 1年を「元年」と書く（令和元年 / 令和1年）</label></div>
    <p class="note">略記の月日は「R6.3.15」のようにドット区切りになります（区切りで変更可）。江戸期の元号は略記にならず、そのまま表示します。</p>
  </fieldset>

  <div class="preview" aria-live="polite">
    <h2>プレビュー</h2>
    <div id="p1"></div><div id="p2"></div><div id="p3"></div>
  </div>

  <div class="row">
    <button id="reset" type="button">初期設定に戻す</button>
    <span id="status"></span>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
